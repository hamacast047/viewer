<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工事実績一覧ビューア</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Bebas+Neue&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2335;
    --border: #2a3050;
    --accent: #4f8eff;
    --accent2: #ff6b35;
    --text: #e8ecf4;
    --text-dim: #7a86a8;
    --tokyo: #4f8eff;
    --nagoya: #ff6b35;
    --osaka: #2de08e;
    --partner: #c97dff;
    --claim: #ff4f6b;
    --other: #ffd166;
    --bousui: #4f8eff;
    --toso: #2de08e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }


  [data-theme="light"] {
    --bg: #f0f2f8;
    --surface: #ffffff;
    --surface2: #e8ecf5;
    --border: #c4cce0;
    --text: #0e1525;
    --text-dim: #2e3d5c;
  }
  [data-theme="light"] tbody td:nth-child(odd) {
    background-color: rgba(0,0,0,0.035);
  }
  [data-theme="light"] tbody td:nth-child(even) {
    background-color: transparent;
  }
  [data-theme="light"] thead th:nth-child(odd),
  [data-theme="light"] thead th:nth-child(even) {
    background-color: var(--surface2) !important;
  }
  [data-theme="light"] tbody tr:hover td { background-color: rgba(79,142,255,0.08) !important; }
  [data-theme="light"] tbody td { color: #2e3d5c; }
  [data-theme="light"] .no-cell { color: #2e3d5c; }
  [data-theme="light"] .addr-cell { color: #2e3d5c; }
  [data-theme="light"] .amount-cell { color: #2e3d5c; }
  [data-theme="light"] thead th { color: #4a5570; }
  [data-theme="light"] .tag-東京  { background: rgba(79,142,255,0.15); color: #1a5fd4; }
  [data-theme="light"] .tag-名古屋 { background: rgba(255,107,53,0.15); color: #c04a10; }
  [data-theme="light"] .tag-大阪  { background: rgba(45,224,142,0.15); color: #0a7a45; }
  [data-theme="light"] .tag-その他 { background: rgba(201,125,255,0.15); color: #7a30c0; }
  [data-theme="light"] .type-防水 { background: rgba(79,142,255,0.12); color: #1a5fd4; }
  [data-theme="light"] .type-塗装 { background: rgba(45,224,142,0.12); color: #0a7a45; }
  [data-theme="light"] .type-クレーム { background: rgba(255,79,107,0.12); color: #c01030; }
  [data-theme="light"] .type-その他 { background: rgba(180,140,0,0.12); color: #7a5e00; }
  [data-theme="light"] .hl { background: rgba(255,180,0,0.3); color: #7a5000; }
  [data-theme="light"] .amount-cell.high { color: #0a7a45; }
  [data-theme="light"] .name-link { color: #0e1525; }
  [data-theme="light"] .name-link:hover { color: #1a5fd4; }
  [data-theme="light"] .count-badge { color: #2e3d5c; }
  [data-theme="light"] .search-mode-label { color: #2e3d5c; }
  [data-theme="light"] .radio-group label { color: #2e3d5c; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ===== HEADER ===== */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--accent);
    flex-shrink: 0;
  }
  header .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ===== DROP ZONE ===== */
  #dropZone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 60px);
    padding: 40px;
  }
  .drop-box {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 60px 80px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s;
    max-width: 520px;
    width: 100%;
  }
  .drop-box:hover, .drop-box.dragover {
    border-color: var(--accent);
    background: rgba(79,142,255,0.05);
  }
  .drop-icon {
    font-size: 52px;
    margin-bottom: 16px;
  }
  .drop-box h2 {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .drop-box p {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .drop-btn {
    margin-top: 24px;
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .drop-btn:hover { opacity: 0.85; }
  #fileInput { display: none; }

  /* ===== MAIN APP ===== */
  #app { display: none; }

  .toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .search-panel {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 0 0 auto;
    width: 480px;
    overflow: visible;
    margin-right: 30px;
  }
  .search-rows {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .search-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
  }
  .search-row-input {
    display: flex;
    align-items: center;
    gap: 0;
    width: fit-content;
  }
  .search-row-input .search-box {
    width: 480px;
    flex-shrink: 0;
  }
  .search-row-input .remove-row-btn {
    flex-shrink: 0;
    margin-left: 6px;
  }
  .search-box {
    position: relative;
    flex: 1;
  }
  .search-box input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 32px 8px 34px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box .icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    font-size: 14px;
    pointer-events: none;
  }
  .search-box .clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    display: none;
  }
  .search-box input:not(:placeholder-shown) ~ .clear-btn { display: block; }
  .search-box .clear-btn:hover { color: var(--text); }
  .search-options {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .search-mode-label {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .radio-group {
    display: flex;
    gap: 10px;
  }
  .radio-group label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.15s;
  }
  .radio-group label:hover { color: var(--text); }
  .radio-group input[type=radio] { accent-color: var(--accent); cursor: pointer; }
  .add-search-btn {
    font-size: 11px;
    color: var(--accent);
    background: none;
    border: 1px dashed var(--accent);
    border-radius: 6px;
    padding: 3px 9px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .add-search-btn:hover { background: rgba(79,142,255,0.1); }
  .remove-row-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .remove-row-btn:hover { color: var(--claim); }
  .target-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
    width: 100%;
  }
  .target-tag {
    padding: 3px 9px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    line-height: 1.4;
  }
  .target-tag:hover { border-color: var(--accent); color: var(--text); }
  .target-tag.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .target-tag.all-active { color: var(--text-dim); border-color: var(--border); background: transparent; }
  .target-tag-reset {
    padding: 3px 9px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    opacity: 0.6;
  }
  .target-tag-reset:hover { border-color: var(--accent2); color: var(--accent2); opacity: 1; }
  .hl { background: rgba(255,209,102,0.35); color: #ffd166; border-radius: 2px; padding: 0 1px; }

  .filter-group {
    display: inline-flex;
    flex-direction: column;
    gap: 5px;
    flex-shrink: 0;
  }
  .filter-group-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 0 2px;
  }
  .filter-group-row {
    display: flex;
    gap: 5px;
  }
  /* 上段の「すべて」「全工種」ボタンを下段全体の幅に stretch */
  .filter-group-row:nth-child(2) .filter-btn {
    flex: 1;
    text-align: center;
  }
  .filter-btn {
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { color: #fff; border-color: transparent; }
  .filter-btn[data-region="東京"].active { background: var(--tokyo); }
  .filter-btn[data-region="名古屋"].active { background: var(--nagoya); }
  .filter-btn[data-region="大阪"].active { background: var(--osaka); }
  .filter-btn[data-region="その他"].active { background: var(--partner); }
  .filter-btn[data-type="防水"].active { background: var(--bousui); }
  .filter-btn[data-type="塗装"].active { background: var(--toso); }
  .filter-btn[data-type="クレーム"].active { background: var(--claim); }
  .filter-btn.active.all { background: var(--accent); }

  .count-badge {
    font-size: 12px;
    color: var(--text-dim);
    padding: 0 8px;
    flex-shrink: 0;
  }
  .count-badge span { color: var(--accent); font-weight: 700; }

  /* ===== TABLE ===== */
  .table-wrap {
    overflow-x: auto;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    position: relative;
  }
  table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead {
    position: sticky;
    top: 0;
    z-index: 10;
  }
  thead th {
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--text); }
  thead th.sort-asc::after { content: ' ▲'; font-size: 9px; }
  thead th.sort-desc::after { content: ' ▼'; font-size: 9px; }

  tbody tr {
    border-bottom: 1px solid rgba(42,48,80,0.3);
    transition: background 0.12s;
  }
  tbody td {
    padding: 11px 14px;
    vertical-align: top;
    word-break: break-all;
    overflow-wrap: break-word;
    white-space: normal;
  }
  /* 列ストライプ（ダーク） */
  tbody td:nth-child(odd) {
    background-color: rgba(255,255,255,0.025);
  }
  tbody td:nth-child(even) {
    background-color: transparent;
  }
  /* ヘッダーは不透明固定 */
  thead th:nth-child(odd),
  thead th:nth-child(even) {
    background-color: var(--surface2) !important;
  }
  tbody tr:hover td { background-color: rgba(200,210,230,0.13) !important; }

  .region-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .tag-東京  { background: rgba(79,142,255,0.15); color: var(--tokyo); }
  .tag-名古屋 { background: rgba(255,107,53,0.15); color: var(--nagoya); }
  .tag-大阪  { background: rgba(45,224,142,0.15); color: var(--osaka); }
  .tag-その他 { background: rgba(201,125,255,0.15); color: var(--partner); }
  .tag-クレーム { background: rgba(255,79,107,0.15); color: var(--claim); }

  .type-tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    margin-left: 4px;
    white-space: nowrap;
  }
  .type-防水 { background: rgba(79,142,255,0.1); color: #8ab4ff; }
  .type-塗装 { background: rgba(45,224,142,0.1); color: #6ee8b4; }
  .type-クレーム { background: rgba(255,79,107,0.1); color: #ff8fa0; }
  .type-その他 { background: rgba(255,209,102,0.1); color: #ffd166; }

  .name-link {
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
    line-height: 1.4;
    display: block;
  }
  .name-link:hover { color: var(--accent); text-decoration: underline; }

  .addr-cell {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.4;
    cursor: pointer;
    transition: color 0.15s;
  }
  .addr-cell:hover { color: var(--accent); }
  .addr-cell .map-icon { margin-right: 4px; opacity: 0.6; }

  .amount-cell {
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    font-size: 12px;
  }
  .amount-cell.high { color: var(--osaka); }

  .no-cell {
    color: var(--text-dim);
    font-size: 11px;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--surface2); border-radius: 6px; }
  ::-webkit-scrollbar-thumb { background: #4a5580; border-radius: 6px; border: 2px solid var(--surface2); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  ::-webkit-scrollbar-corner { background: var(--surface2); }

  /* loading */
  #loading {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,17,23,0.85);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  #loading.show { display: flex; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }
  .empty-state p { font-size: 14px; margin-top: 8px; }

  /* ===== AMOUNT FILTER ===== */
  .amount-filter {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    flex-shrink: 0;
    flex-grow: 0;
    transition: border-color 0.2s;
    width: fit-content;
  }
  .amount-filter:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,142,255,0.2); }
  .amount-filter label {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    letter-spacing: 0.5px;
  }
  .amount-filter input {
    width: 80px;
    min-width: 80px;
    max-width: 80px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    outline: none;
    text-align: right;
    -moz-appearance: textfield;
  }
  .amount-filter input::-webkit-outer-spin-button,
  .amount-filter input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .amount-filter input::placeholder { color: var(--text-dim); font-size: 12px; }
  .amount-filter input:focus::placeholder { color: transparent; }
  .amount-filter .sep {
    color: var(--text-dim);
    font-size: 12px;
  }
  .amount-filter .unit {
    font-size: 11px;
    color: var(--text-dim);
  }
  .amt-sublabel {
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .amount-filter-active { border-color: var(--accent2) !important; box-shadow: 0 0 0 2px rgba(255,107,53,0.2) !important; }
  .amt-apply-btn {
    padding: 4px 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  .amt-apply-btn:hover { opacity: 0.8; }
  .amt-clear-btn {
    padding: 4px 8px;
    background: transparent;
    color: var(--accent2);
    border: 1px solid var(--accent2);
    border-radius: 5px;
    font-size: 11px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .amt-clear-btn:hover { background: rgba(255,107,53,0.1); }

  /* ===== MOBILE ===== */
  /* モバイル用：検索・フィルター開閉トグル */
  #toolbarToggle { display: none; }

  @media (max-width: 768px) {
    header { padding: 10px 14px; gap: 10px; }
    header h1 { font-size: 18px; letter-spacing: 1px; }
    #headerFileMeta { display: none !important; }

    #toolbarToggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }
    #toolbarToggle .ttl-label {
      font-size: 13px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #toolbarToggle .ttl-badge {
      font-size: 11px;
      color: var(--accent);
      background: rgba(79,142,255,0.12);
      border-radius: 10px;
      padding: 1px 7px;
      display: none;
    }
    #toolbarToggle.has-filter .ttl-badge { display: inline-block; }
    #toolbarToggle .ttl-arrow {
      font-size: 11px;
      color: var(--text-dim);
      transition: transform 0.2s;
    }
    #toolbarToggle.open .ttl-arrow { transform: rotate(180deg); }

    .toolbar {
      padding: 10px 12px;
      gap: 8px;
      flex-direction: column;
      align-items: stretch;
      display: none;
      max-height: 60vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .toolbar.open { display: flex; }
    .toolbar.open > * { flex-shrink: 0; }
    .search-panel { width: 100% !important; flex: none; }
    .search-row-input .search-box { width: 100% !important; }
    .search-options { flex-wrap: wrap; gap: 8px; }
    .filter-group { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px; }
    .filter-group-label { width: 100%; }
    .filter-group-row { flex-wrap: wrap; }
    .amount-filter { flex-wrap: wrap; gap: 4px; width: 100%; }
    .amount-filter input { width: 70px; min-width: 70px; max-width: 70px; }
    .count-badge { text-align: left; white-space: nowrap; }

    /* iOSのフォーカス時自動ズームを防ぐ */
    .search-box input,
    .amount-filter input {
      font-size: 16px;
    }

    .table-wrap { overflow-x: unset; }
    table, colgroup { display: none; }

<script>
// ===== INDEXEDDB =====
const DB_NAME = 'KojiViewer';
const DB_VER = 1;
const STORE = 'fileCache';

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => e.target.result.createObjectStore(STORE);
    req.onsuccess = e => res(e.target.result);
    req.onerror = e => rej(e.target.error);
  });
}

async function saveToCache(fileName, arrayBuffer, records) {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE, 'readwrite');
    const st = tx.objectStore(STORE);
    st.put({ fileName, savedAt: new Date().toISOString(), buffer: arrayBuffer, records }, 'latest');
  } catch(e) { console.warn('IndexedDB save failed:', e); }
}

async function loadFromCache() {
  try {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get('latest');
      req.onsuccess = e => res(e.target.result || null);
      req.onerror = () => res(null);
    });
  } catch(e) { return null; }
}

async function clearCache() {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete('latest');
  } catch(e) {}
}

let allRecords = [];
let filterRegion = 'all';
let filterType = 'all';
let searchTerms = [];
let searchMode = 'and';
let sortCol = null;
let sortDir = 1;
let amtMin = null;
let amtMax = null;

// ===== FILE HANDLING =====
const dropBox = document.getElementById('dropBox');
const fileInput = document.getElementById('fileInput');

dropBox.addEventListener('dragover', e => { e.preventDefault(); dropBox.classList.add('dragover'); });
dropBox.addEventListener('dragleave', () => dropBox.classList.remove('dragover'));
dropBox.addEventListener('drop', e => {
  e.preventDefault();
  dropBox.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});
document.getElementById('fileInput2').addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

let currentFileName = '';
function loadFile(file) {
  currentFileName = file.name;
  document.getElementById('loading').classList.add('show');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      allRecords = [];
      wb.SheetNames.forEach(name => {
        const ws = wb.Sheets[name];
        // ヘッダー行取得
        const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
        const headers = {};
        for (let c = range.s.c; c <= range.e.c; c++) {
          const cell = ws[XLSX.utils.encode_cell({r: range.s.r, c})];
          if (cell && cell.v != null) headers[String(cell.v).trim()] = c;
        }
        // セルから改行を保持した値を取得するヘルパー
        function getCellVal(r, colName) {
          const aliases = { '住所': ['住所','所在地'], 'ゼネコン': ['ゼネコン','元請'] };
          const cols = aliases[colName] ? aliases[colName] : [colName];
          for (const cn of cols) {
            const c = headers[cn];
            if (c == null) continue;
            const cell = ws[XLSX.utils.encode_cell({r, c})];
            if (!cell || cell.v == null) continue;
            // 改行を含む文字列セルはwプロパティに表示値、vに生値
            // cell.vを優先（セル内改行が保持される）、数値型のみcell.wで書式化値を使用
            const raw = (typeof cell.v === 'string') ? cell.v : (cell.w !== undefined ? cell.w : String(cell.v));
            return raw;
          }
          return '';
        }
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: true });
        const { region, type } = classifySheet(name);
        rows.forEach((row, ri) => {
          const dataRow = range.s.r + 1 + ri; // ヘッダー分+1
          const addr = getCellVal(dataRow, '住所');
          const zeneo = getCellVal(dataRow, 'ゼネコン');
          allRecords.push({
            マスタNo: getCellVal(dataRow, 'マスタNo'),
            現場名: getCellVal(dataRow, '現場名'),
            address: addr,
            ゼネコン: zeneo,
            仕様: getCellVal(dataRow, '仕様'),
            面積: getCellVal(dataRow, '面積'),
            色番号: getCellVal(dataRow, '色番号'),
            金額: row['金額'] || '',
            担当: getCellVal(dataRow, '担当'),
            region, type, sheet: name,
            _raw: row
          });
        });
      });
      allRecords = allRecords.filter(r => r.現場名);
      saveToCache(currentFileName, e.target.result, allRecords);
      showApp(currentFileName, true);
      renderTable();
    } catch(err) {
      alert('ファイルの読み込みに失敗しました: ' + err.message);
    }
    document.getElementById('loading').classList.remove('show');
  };
  reader.readAsArrayBuffer(file);
}

function showApp(fileName, isNew) {
  document.getElementById('dropZone').style.display = 'none';
  const app = document.getElementById('app');
  app.style.display = 'flex';
  app.style.flexDirection = 'column';
  app.style.flex = '1';
  app.style.overflow = 'hidden';
  const meta = document.getElementById('headerFileMeta');
  meta.style.display = 'flex';
  document.getElementById('headerFileName').textContent = '📄 ' + fileName;
  document.getElementById('headerFileSaved').textContent = isNew ? '保存済み' : '前回のファイルを復元';
}

function restoreFromDB() {
  document.getElementById('loading').classList.add('show');
  loadFromCache().then(cached => {
    if (!cached) { document.getElementById('loading').classList.remove('show'); return; }
    allRecords = cached.records;
    showApp(cached.fileName, false);
    renderTable();
    document.getElementById('loading').classList.remove('show');
  });
}

function dismissRestore() {
  document.getElementById('restoreBanner').style.display = 'none';
  document.getElementById('dropBox').style.display = 'block';
}

function classifySheet(name) {
  let region = 'その他', type = 'その他';
  if (name.includes('東京')) region = '東京';
  else if (name.includes('名古屋')) region = '名古屋';
  else if (name.includes('大阪')) region = '大阪';
  else if (name.includes('クレーム') || name.includes('ｸﾚｰﾑ')) { region = 'その他'; type = 'クレーム'; return { region, type }; }

  if (name.includes('防水')) type = '防水';
  else if (name.includes('塗装')) type = '塗装';
  return { region, type };
}

// ===== FILTERS =====
document.getElementById('regionFilters').addEventListener('click', e => {
  if (!e.target.dataset.region) return;
  filterRegion = e.target.dataset.region;
  document.querySelectorAll('[data-region]').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderTable();
});
document.getElementById('typeFilters').addEventListener('click', e => {
  if (!e.target.dataset.type) return;
  filterType = e.target.dataset.type;
  document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  renderTable();
});
// 正規化：半角カナ・全角カナ・ひらがなをすべてひらがなに統一、英数は小文字半角に
function normalizeText(str) {
  // NFKC: 半角カナ+濁点を全角カナに合成、全角英数を半角に変換
  let s = str.normalize('NFKC').toLowerCase();
  // 全角カタカナ→ひらがな
  s = s.replace(/[ァ-ン]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  // ヴ→ゔ
  s = s.replace(/ヴ/g, 'ゔ');
  return s;
}

function getSearchInputs() {
  return Array.from(document.querySelectorAll('#searchRows .search-row'))
    .map(row => {
      const val = normalizeText(row.querySelector('input').value.trim());
      const fields = getRowFields(row);
      return val ? { val, fields } : null;
    })
    .filter(Boolean);
}
let _searchDebounceTimer = null;
function onSearchInput() {
  // 入力値はすぐ反映、renderTableだけ遅延
  searchTerms = getSearchInputs();
  searchMode = document.querySelector('input[name=searchMode]:checked').value;
  clearTimeout(_searchDebounceTimer);
  _searchDebounceTimer = setTimeout(renderTable, 180);
}
function onSearchKey(e) {
  if (e.key === 'Enter') {
    clearTimeout(_searchDebounceTimer);
    renderTable();
  }
}
function clearSearchRow(btn) {
  btn.closest('.search-box').querySelector('input').value = '';
  onSearchInput();
}
function addSearchRow() {
  const rows = document.getElementById('searchRows');
  const idx = rows.children.length;
  const div = document.createElement('div');
  div.className = 'search-row';
  div.dataset.index = idx;
  const tagHTML = [['マスタNo','No'],['現場名','工事名'],['address','住所'],['ゼネコン','ゼネコン'],['仕様','仕様'],['面積','面積'],['色番号','色番号'],['担当','担当']]
    .map(([f,l]) => `<button class="target-tag all-active" data-field="${f}" onclick="toggleTargetTag(this)">${l}</button>`).join('');
  div.innerHTML = `<div class="search-row-input">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" placeholder="条件 ${idx + 1}" oninput="onSearchInput()" onkeydown="onSearchKey(event)">
      <button class="clear-btn" onclick="clearSearchRow(this)" tabindex="-1">✕</button>
    </div>
    <button class="remove-row-btn" onclick="removeSearchRow(this)" title="この条件を削除">✕</button>
  </div>
  <div class="target-tags">${tagHTML}<button class="target-tag-reset" onclick="resetTargetTags(this.closest('.target-tags'))">リセット</button></div>`;
  rows.appendChild(div);
  div.querySelector('input').focus();
}
function toggleTargetTag(btn) {
  const tags = btn.closest('.target-tags').querySelectorAll('.target-tag');
  const isAllActive = Array.from(tags).every(t => t.classList.contains('all-active') || t.classList.contains('active'));
  if (isAllActive) {
    // 全ON状態 → クリックしたものだけONに切り替え
    tags.forEach(t => { t.classList.remove('active', 'all-active'); });
    btn.classList.add('active');
  } else {
    btn.classList.toggle('active');
    // 全部OFFになったらリセット
    const anyActive = Array.from(tags).some(t => t.classList.contains('active'));
    if (!anyActive) resetTargetTags(btn.closest('.target-tags'));
  }
  onSearchInput();
}

function resetTargetTags(container) {
  container.querySelectorAll('.target-tag').forEach(t => {
    t.classList.remove('active');
    t.classList.add('all-active');
  });
  onSearchInput();
}

function getRowFields(row) {
  const active = row.querySelectorAll('.target-tag.active');
  // all-active（全ON）かactiveが0なら全フィールド対象
  if (active.length === 0) return ['マスタNo','現場名','address','ゼネコン','仕様','面積','色番号','担当'];
  return Array.from(active).map(b => b.dataset.field);
}

function removeSearchRow(btn) {
  btn.closest('.search-row').remove();
  onSearchInput();
}

// ===== AMOUNT FILTER =====
function applyAmtFilter() {
  const minVal = document.getElementById("amtMin").value;
  const maxVal = document.getElementById("amtMax").value;
  amtMin = minVal !== "" ? parseFloat(minVal) * 10000 : null;
  amtMax = maxVal !== "" ? parseFloat(maxVal) * 10000 : null;
  const active = amtMin !== null || amtMax !== null;
  document.getElementById("amountFilterBox").classList.toggle("amount-filter-active", active);
  document.getElementById("amtClearBtn").style.display = active ? "inline-block" : "none";
  renderTable();
}
function clearAmtFilter() {
  document.getElementById("amtMin").value = "";
  document.getElementById("amtMax").value = "";
  amtMin = null;
  amtMax = null;
  document.getElementById("amountFilterBox").classList.remove("amount-filter-active");
  document.getElementById("amtClearBtn").style.display = "none";
  renderTable();
}
document.getElementById("amtMin").addEventListener("keydown", e => { if (e.key === "Enter") applyAmtFilter(); });
document.getElementById("amtMax").addEventListener("keydown", e => { if (e.key === "Enter") applyAmtFilter(); });

// ===== SORT =====
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('thead th').forEach(t => t.classList.remove('sort-asc','sort-desc'));
    th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
    renderTable();
  });
});

// ===== RENDER =====
function toggleToolbar() {
  document.getElementById('toolbar').classList.toggle('open');
  document.getElementById('toolbarToggle').classList.toggle('open');
}

function updateFilterBadge() {
  const active = filterRegion !== 'all' || filterType !== 'all' || searchTerms.length > 0 || amtMin !== null || amtMax !== null;
  document.getElementById('toolbarToggle').classList.toggle('has-filter', active);
}

function renderTable() {
  updateFilterBadge();
  let data = allRecords.filter(r => {
    if (filterRegion !== 'all' && r.region !== filterRegion) return false;
    if (filterType !== 'all' && r.type !== filterType) return false;
    if (searchTerms.length > 0) {
      const fieldMap = { 現場名: r.現場名, address: r.address, ゼネコン: r.ゼネコン, 仕様: r.仕様, 面積: r.面積, 色番号: r.色番号, 担当: r.担当, マスタNo: r.マスタNo };
      const termMatch = term => {
        const haystack = normalizeText(term.fields.map(f => fieldMap[f] || '').join(' '));
        return haystack.includes(term.val);
      };
      const match = searchMode === 'and'
        ? searchTerms.every(termMatch)
        : searchTerms.some(termMatch);
      if (!match) return false;
    }
    if (amtMin !== null || amtMax !== null) {
      const n = parseFloat(String(r.金額).replace(/[^\d.]/g,"")) || 0;
      if (amtMin !== null && n < amtMin) return false;
      if (amtMax !== null && n >= amtMax) return false;
    }
    return true;
  });

  if (sortCol) {
    data = data.slice().sort((a, b) => {
      let av = a[sortCol] || '', bv = b[sortCol] || '';
      if (sortCol === '金額') { av = parseFloat(String(av).replace(/[^\d.]/g,'')) || 0; bv = parseFloat(String(bv).replace(/[^\d.]/g,'')) || 0; }
      if (av < bv) return -sortDir;
      if (av > bv) return sortDir;
      return 0;
    });
  }

  document.getElementById('countDisplay').textContent = data.length.toLocaleString();

  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');

  if (data.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // Render max 2000 rows for perf
  const visible = data.slice(0, 2000);
  tbody.innerHTML = visible.map(r => {
    const amt = formatAmount(r.金額);
    const isHigh = parseFloat(String(r.金額).replace(/[^\d.]/g,'')) >= 10000000;
    const addrText = r.address ? `<span class="map-icon">📍</span>${highlight(r.address,'address')}` : '<span style="color:var(--text-dim);font-size:11px">—</span>';
    return `<tr>
      <td class="no-cell">${highlight(String(r.マスタNo),'マスタNo')}</td>
      <td><span class="region-tag tag-${r.region}">${r.region}</span></td>
      <td><span class="type-tag type-${r.type}">${r.type}</span></td>
      <td>
        ${r.address
          ? `<a class="name-link" onclick="openMap('${escJs(r.address)}','${escJs(r.現場名)}')">${highlight(r.現場名,'現場名')}</a>`
          : `<span class="name-link">${highlight(r.現場名,'現場名')}</span>`}
      </td>
      <td class="addr-cell" ${r.address ? `onclick="openMap('${escJs(r.address)}','${escJs(r.現場名)}')"` : ''}>${addrText}</td>
      <td style="font-size:12px;color:var(--text-dim)">${highlight(r.ゼネコン,'ゼネコン')}</td>
      <td style="font-size:12px;color:var(--text-dim)">${highlight(r.仕様,'仕様')}</td>
      <td style="font-size:12px;color:var(--text-dim);text-align:right;">${r.面積 ? highlight(String(r.面積),'面積') + (/[㎡m]/i.test(String(r.面積)) ? '' : '<span style="font-size:10px;margin-left:2px">㎡</span>') : '—'}</td>
      <td style="font-size:12px;color:var(--text-dim)">${highlight(r.色番号,'色番号')}</td>
      <td class="amount-cell ${isHigh ? 'high' : ''}">${amt}</td>
      <td style="font-size:12px;color:var(--text-dim)">${highlight(r.担当,'担当')}</td>
    </tr>`;
  }).join('');

  if (data.length > 2000) {
    tbody.innerHTML += `<tr><td colspan="11" style="text-align:center;padding:16px;color:var(--text-dim);font-size:12px">
      ※ 表示上限 2,000件。検索・フィルターで絞り込んでください（全 ${data.length.toLocaleString()} 件）
    </td></tr>`;
  }

  // モバイル：カード描画
  const cardList = document.getElementById('cardList');
  const emptyCard = document.getElementById('emptyStateCard');
  if (!cardList) return;
  if (data.length === 0) {
    cardList.innerHTML = '';
    if (emptyCard) emptyCard.style.display = 'block';
    return;
  }
  if (emptyCard) emptyCard.style.display = 'none';
  cardList.innerHTML = visible.map(r => {
    const amt = formatAmount(r.金額);
    const isHigh = parseFloat(String(r.金額).replace(/[^\d.]/g,'')) >= 10000000;
    return `<div class="card">
      <div class="card-header">
        <div class="card-title" ${r.address ? `onclick="openMap('${escJs(r.address)}','${escJs(r.現場名)}')"` : ''}>
          ${highlight(r.現場名,'現場名')}
        </div>
        <div class="card-tags">
          <span class="region-tag tag-${r.region}">${r.region}</span>
          <span class="type-tag type-${r.type}">${r.type}</span>
        </div>
      </div>
      <div class="card-body">
        ${r.address ? `<span class="card-label">住所</span><span class="card-value card-addr" onclick="openMap('${escJs(r.address)}','${escJs(r.現場名)}')")>📍 ${highlight(r.address,'address')}</span>` : ''}
        ${r.ゼネコン ? `<span class="card-label">ゼネコン</span><span class="card-value">${highlight(r.ゼネコン,'ゼネコン')}</span>` : ''}
        ${r.仕様 ? `<span class="card-label">仕様</span><span class="card-value">${highlight(r.仕様,'仕様')}</span>` : ''}
        ${r.面積 ? `<span class="card-label">面積</span><span class="card-value">${highlight(String(r.面積),'面積')}${/[㎡m]/i.test(String(r.面積)) ? '' : '㎡'}</span>` : ''}
        ${r.色番号 ? `<span class="card-label">色番号</span><span class="card-value">${highlight(r.色番号,'色番号')}</span>` : ''}
        ${amt !== '—' ? `<span class="card-label">金額</span><span class="card-value card-amount ${isHigh?'high':''}">${amt}</span>` : ''}
        ${r.担当 ? `<span class="card-label">担当</span><span class="card-value">${highlight(r.担当,'担当')}</span>` : ''}
        ${r.マスタNo ? `<span class="card-label">No</span><span class="card-value">${highlight(String(r.マスタNo),'マスタNo')}</span>` : ''}
      </div>
    </div>`;
  }).join('') + (data.length > 2000 ? `<div style="text-align:center;padding:16px;color:var(--text-dim);font-size:12px">※ 表示上限 2,000件（全 ${data.length.toLocaleString()} 件）</div>` : '');
}

function toggleTheme() {
  const root = document.documentElement;
  const btn = document.getElementById('themeToggle');
  if (root.getAttribute('data-theme') === 'light') {
    root.removeAttribute('data-theme');
    btn.textContent = '☀️';
    localStorage.setItem('kojiViewerTheme', 'dark');
  } else {
    root.setAttribute('data-theme', 'light');
    btn.textContent = '🌙';
    localStorage.setItem('kojiViewerTheme', 'light');
  }
}

// 起動時にテーマ復元
(function() {
  const saved = localStorage.getItem('kojiViewerTheme');
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    // ボタンはDOM構築後に設定
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = '🌙';
    });
  }
})();

function openMap(address, name) {
  const q = encodeURIComponent(address);
  window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, '_blank');
}

function formatAmount(val) {
  if (!val) return '—';
  const n = parseFloat(String(val).replace(/[^\d.]/g,''));
  if (isNaN(n)) return String(val);
  if (n >= 1000000) return (n / 10000).toLocaleString('ja-JP', {maximumFractionDigits: 0}) + '万円';
  return n.toLocaleString('ja-JP') + '円';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// searchTerms のうち、このフィールドに適用すべきキーワードを取得してハイライト
function highlight(rawStr, field) {
  if (!searchTerms.length) return escHtml(rawStr);
  const keywords = searchTerms
    .filter(t => t.fields.includes(field))
    .map(t => t.val)
    .filter(Boolean);
  if (!keywords.length) return escHtml(rawStr);

  const str = String(rawStr);

  // 半角カナ+濁点(ﾞ)/半濁点(ﾟ)をペアでNFKCしつつ normStr と位置マップを構築
  const DAKUTEN = '\uff9e', HANDAKUTEN = '\uff9f';
  const origChars = Array.from(str);
  const segs = [];
  let i = 0;
  while (i < origChars.length) {
    const c = origChars[i];
    if (i + 1 < origChars.length && (origChars[i+1] === DAKUTEN || origChars[i+1] === HANDAKUTEN)) {
      segs.push({ origStart: i, origEnd: i + 2, norm: normalizeText(c + origChars[i+1]) });
      i += 2;
    } else {
      segs.push({ origStart: i, origEnd: i + 1, norm: normalizeText(c) });
      i += 1;
    }
  }

  let normStr = '';
  const normToOrigStart = [], normToOrigEnd = [];
  segs.forEach(seg => {
    for (let j = 0; j < seg.norm.length; j++) {
      normToOrigStart.push(seg.origStart);
      normToOrigEnd.push(seg.origEnd);
    }
    normStr += seg.norm;
  });

  let ranges = [];
  keywords.forEach(kw => {
    let pos = 0;
    while (true) {
      const idx = normStr.indexOf(kw, pos);
      if (idx === -1) break;
      ranges.push([normToOrigStart[idx], normToOrigEnd[idx + kw.length - 1]]);
      pos = idx + 1;
    }
  });
  if (!ranges.length) return escHtml(str);

  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const [s, e] of ranges) {
    if (merged.length && s < merged[merged.length-1][1]) {
      merged[merged.length-1][1] = Math.max(merged[merged.length-1][1], e);
    } else { merged.push([s, e]); }
  }

  let result = '', prev = 0;
  for (const [s, e] of merged) {
    result += escHtml(origChars.slice(prev, s).join(''));
    result += '<span class="hl">' + escHtml(origChars.slice(s, e).join('')) + '</span>';
    prev = e;
  }
  result += escHtml(origChars.slice(prev).join(''));
  return result;
}
function escJs(s) {
  return String(s).replace(/'/g,"\\'").replace(/\n/g,' ');
}

// ===== STARTUP: キャッシュ確認 =====
(async () => {
  const cached = await loadFromCache();
  if (cached) {
    const banner = document.getElementById('restoreBanner');
    document.getElementById('dropBox').style.display = 'none';
    banner.style.display = 'block';
    document.getElementById('restoreFileName').textContent = '📄 ' + cached.fileName;
    const d = new Date(cached.savedAt);
    document.getElementById('restoreMeta').textContent =
      `保存日時: ${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} ／ ${cached.records.length.toLocaleString()}件`;
  }
})();
